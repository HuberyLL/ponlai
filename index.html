<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<title>Soomi · Island</title>
	<link rel="icon" href="data:," />
	<style>
		:root { color-scheme: dark; }
		html, body { margin: 0; height: 100%; background: #0b1a1f; overflow: hidden; }
		#app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
		#loading {
			position: fixed; inset: 0; display: grid; place-items: center;
			background: radial-gradient( ellipse at center, #17343b 0%, #0b1a1f 70% );
			color: #cfe3e6; font: 500 14px/1.4 ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif;
			letter-spacing: 0.04em; transition: opacity 0.8s ease 0.2s; z-index: 10;
		}
		#loading.done { opacity: 0; pointer-events: none; }
		.lil-gui.root { --width: 280px; }
		#camera-hint {
			position: fixed; left: max( 16px, env( safe-area-inset-left ) ); bottom: max( 16px, env( safe-area-inset-bottom ) );
			max-width: calc( 100vw - 64px ); padding: 10px 14px; border-radius: 8px;
			background: rgb( 9 24 29 / 76% ); color: #d9e7e3; font: 12px/1.7 ui-sans-serif, system-ui, "PingFang SC", sans-serif;
			z-index: 2; user-select: none;
		}
		#camera-hint[hidden] { display: none; }
		#camera-hint strong { color: #f4deb0; }
		#camera-hint button {
			font: inherit; color: #f4deb0; background: transparent; border: 1px solid rgb( 244 222 176 / 28% );
			border-radius: 4px; margin: 4px 6px 0 0; padding: 2px 8px; cursor: pointer;
		}
		#camera-hint button:hover, #camera-hint button:focus-visible { background: rgb( 244 222 176 / 16% ); }
	</style>
</head>
<body>
	<div id="app"></div>
	<div id="camera-hint">
		<strong id="camera-mode">自由镜头</strong> · <span id="camera-input">鼠标拖动转向 · WASD 移动 · Q/E 下降/上升 · Shift 加速 · 滚轮调速</span><br />
		R 回岛 · 1/2/3 岛屿/海平线/天空 · N 午夜 · B 白天 · Space 暂停 · H 参数 · / 隐藏提示<br />
		<button id="view-sky" type="button">看天空</button><button id="view-island" type="button">回到岛屿</button>
		<button id="view-day" type="button">白天</button><button id="view-night" type="button">午夜</button>
	</div>
	<div id="loading"><span>Loading…</span></div>
	<script type="module" src="/src/main.ts"></script>
</body>
</html>
