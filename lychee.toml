# lychee: the docs' link check (`npm run lint:docs` offline, `npm run lint:links` online).
include_fragments = "anchor-only"
max_concurrency = 8
timeout = 20
# Sites that refuse automated clients (403, 405) or rate-limit them (429) still exist.
accept = "200..=299, 403, 405, 429"
exclude_all_private = true
exclude_path = [ "(^|/)(node_modules|public|dist|artifacts|\\.claude)/" ]
